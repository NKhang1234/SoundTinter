version: '3.8'

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  filter-service:
    build: ./filterService
    container_name: filter-service
    ports:
      - "8003:8003"
    depends_on:
      - minio
    env_file:
      - .env

  analyst-service:
    build: ./analystService
    container_name: analyst-service
    ports:
      - "8002:8002"
    env_file:
      - .env

volumes:
  minio_data:
