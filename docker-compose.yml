version: '3.8'

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"    # For app communication
  #     - "15672:15672"  # For web UI
  #   environment:
  #     RABBITMQ_DEFAULT_USER: admin
  #     RABBITMQ_DEFAULT_PASS: admin
  #     RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json
  #   volumes:
  #     - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
  #     - ./rabbitmq/init_users.sh:/docker-entrypoint-init.d/init_users.sh
  #     - ./.env:/etc/rabbitmq/.env   # 💡 Mount .env inside the container

  filter-service:
    build:
      context: ./filterService
      dockerfile: Dockerfile
    container_name: filter-service
    ports:
      - "8003:8003"
    depends_on:
      - minio
    env_file:
      - .env

  analyst-service:
    build:
      context: ./analystService
      dockerfile: Dockerfile
    container_name: analyst-service
    ports:
      - "8002:8002"
    depends_on:
      - minio
    env_file:
      - .env

volumes:
  minio_data:
